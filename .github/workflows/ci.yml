name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          # Avoids GitHub rate limiting; uses the automatic repo token.
          # Install-only: no Cachix account, cache, or extra secrets.
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      # Pull-only until the cache owner adds CACHIX_AUTH_TOKEN; then it
      # also pushes fresh builds for testers to substitute.
      - uses: cachix/cachix-action@v15
        with:
          name: zinc
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: build
        run: nix build --print-build-logs
      - name: verify
        run: nix flake check --print-build-logs
